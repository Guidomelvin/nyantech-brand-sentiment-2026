# Konfigurasi Pipeline NYANTECH Brand Sentiment 2026

channel:
  handle: "@NYANTECH"
  # Opsional: isi channel_id jika sudah diketahui
  channel_id: ""
  timezone: "Asia/Jakarta"

date_filter:
  start_date: "2026-01-01"
  end_date: "2026-12-31"
  # Gunakan timezone channel (WIB) untuk batas tanggal & pengelompokan kuartal
  use_local_timezone: true

scraping:
  include_replies: true
  max_comments_per_video: null # null = ambil seluruh komentar
  transcript_languages:
    - "id"
    - "en"
  request_delay_seconds: 0.15
  checkpoint_every_n_videos: 5

smartphone_filter:
  min_confidence_score: 2
  # Video Shorts (<60s) bisa disertakan atau di-skip; default disertakan jika membahas smartphone
  exclude_shorts: false
  positive_keywords:
    - "smartphone"
    - "hp"
    - "hape"
    - "handphone"
    - "ponsel"
    - "flagship"
    - "midrange"
    - "entry level"
    - "kamera hp"
    - "gaming phone"
    - "unboxing"
    - "review"
    - "rekomendasi hp"
    - "mending"
    - "snapdragon"
    - "dimensity"
    - "exynos"
    - "bionic"
    - "tensor"
    - "amoled"
    - "mah"
    - "antutu"
    - "ram"
    - "ufs"
  negative_keywords:
    - "laptop"
    - "notebook"
    - "ultrabook"
    - "macbook"
    - "pc gaming"
    - "rakit pc"
    - "vga"
    - "rtx"
    - "monitor"
    - "keyboard"
    - "mouse"
    - "tws"
    - "earbuds"
    - "headphone"
    - "smartwatch"
    - "smartband"
    - "tablet"
    - "ipad"
    - "konsol"
    - "ps5"
    - "nintendo"
    - "kamera mirrorless"
    - "drone"
    - "powerbank"
    - "charger"

