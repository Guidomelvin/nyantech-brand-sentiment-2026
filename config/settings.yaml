    min_idr: 0
    max_idr: 3000000
  - label: "3-6 juta"
    min_idr: 3000001
    max_idr: 6000000
  - label: "6-10 juta"
    min_idr: 6000001
    max_idr: 10000000
  - label: ">10 juta"
    min_idr: 10000001
    max_idr: null

