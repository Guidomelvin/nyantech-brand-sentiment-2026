[project]
name = "nyantech-brand-sentiment-2026"
version = "0.1.0"
description = "End-to-end YouTube audience sentiment analysis for smartphone brands on NYANTECH (2026)"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
